<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodeStudio Engine</title>

<style>
body {
    margin: 0;
    padding: 0;
    background: linear-gradient(to top, #0f0f0f, #1a1a2e);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

/* Fundo cidade */
.city {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 60%;
    background: url("https://images.unsplash.com/photo-1494976388531-d1058494cdd8") no-repeat center bottom;
    background-size: cover;
    filter: brightness(0.4);
    z-index: 0;
}

/* Container principal */
.container {
    position: relative;
    z-index: 2;
    text-align: center;
}

/* Logo */
.logo {
    font-size: 90px;
    font-weight: bold;
    color: orange;
    text-transform: uppercase;
    position: relative;
    animation: flame 1s infinite alternate;
    text-shadow:
        0 0 10px red,
        0 0 20px orange,
        0 0 40px yellow;
}

/* Animação de fogo */
@keyframes flame {
    0% {
        text-shadow:
            0 0 10px red,
            0 0 20px orange,
            0 0 40px yellow;
        transform: translateY(0px);
    }
    100% {
        text-shadow:
            0 0 20px red,
            0 0 40px orange,
            0 0 60px yellow;
        transform: translateY(-5px);
    }
}

/* Personagem estilo FNF */
.bf {
    margin-top: 20px;
    width: 200px;
    animation: pull 1.5s infinite ease-in-out;
}

/* Movimento puxando */
@keyframes pull {
    0% { transform: translateX(0px); }
    50% { transform: translateX(-15px); }
    100% { transform: translateX(0px); }
}

.footer {
    position: absolute;
    bottom: 10px;
    width: 100%;
    text-align: center;
    color: #aaa;
    font-size: 14px;
}
</style>

</head>

<body>

<div class="city"></div>

<div class="container">
    <div class="logo">CodeStudio</div>
    <img class="bf" src="https://i.imgur.com/Qk4V6xT.png" alt="BF tentando puxar">
</div>

<div class="footer">
    CodeStudio Engine - Powered by Rhythm & Fire 🔥
</div>

</body>
</html>
